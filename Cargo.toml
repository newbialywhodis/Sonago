[package]
name = "sonago"
version = "0.2.2"
edition = "2024"
rust-version = "1.95"
license = "MIT"

[lib]
name = "sonago_core"
crate-type = ["rlib", "cdylib"]

[workspace]
members = ["transcription"]
default-members = [".", "transcription"]
resolver = "3"

[dependencies]
ogg = "0.9.2"
opus = "0.4.0"
rtrb = "0.4.1"
tempfile = "3.27"

[dev-dependencies]
serde_json = "1"

[target.'cfg(windows)'.dependencies]
wasapi = "0.27"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_Security",
    "Win32_System_LibraryLoader",
    "Win32_System_Com",
    "Win32_System_Performance",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[target.'cfg(windows)'.dev-dependencies]
windows = { version = "0.62.2", features = ["Win32_System_ProcessStatus"] }
