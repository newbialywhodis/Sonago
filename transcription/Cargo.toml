[package]
name = "sonago-transcribe"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
publish = false

[dependencies]
ogg = "0.9.2"
opus = "0.4.0"
serde_json = "1"
sha2 = "0.10"
sherpa-onnx = { version = "=2.0.3", default-features = false, features = ["shared"] }
symphonia = { version = "0.5.5", default-features = false, features = ["mkv"] }
tempfile = "3.27"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_System_Threading"] }
